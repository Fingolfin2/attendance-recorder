<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>打卡记录</title>
    <style>
    :root{--bg:#f4f1ea;--paper:#fbfaf6;--card:#fffefa;--ink:#18212f;--muted:#667064;--line:#e4ded2;--navy:#26364f;--navy2:#334966;--teal:#2f6f67;--sage:#8fa99b;--amber:#b7791f;--rose:#b85c5c;--soft-blue:#dfe8ef;--soft-green:#e6efe8;--soft-amber:#f4ead7;--shadow:0 18px 48px rgba(38,54,79,.13),0 5px 14px rgba(31,41,55,.06);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0,rgba(143,169,155,.22),transparent 34%),radial-gradient(circle at 95% 10%,rgba(183,121,31,.12),transparent 30%),linear-gradient(180deg,#f8f5ee 0,#f4f1ea 46%,#eee9df 100%)}button,input,select{font:inherit}button{border:1px solid rgba(38,54,79,.08);border-radius:16px;padding:.78rem 1rem;background:#ede8dc;color:var(--navy);font-weight:800;cursor:pointer}button:active{transform:scale(.985)}input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:.86rem .95rem;background:#fffefa;color:var(--ink);outline:none}input:focus,select:focus{border-color:rgba(47,111,103,.55);box-shadow:0 0 0 4px rgba(47,111,103,.12)}label{display:grid;gap:.42rem;margin:.85rem 0;font-weight:800;color:#394251}.app{width:min(520px,100%);margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}.top{position:relative;overflow:hidden;padding:24px 20px 20px;border-radius:30px;background:linear-gradient(145deg,#243247 0,#2f415d 52%,#1a2433 100%);color:#fffdf7;box-shadow:var(--shadow)}.top:before{content:"";position:absolute;right:-72px;top:-72px;width:190px;height:190px;border-radius:50%;background:rgba(244,234,215,.13)}.top:after{content:"";position:absolute;left:-54px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(143,169,155,.18)}.top>*{position:relative}.kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#d9e1dc;font-size:.88rem;font-weight:750}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:rgba(255,253,247,.12);border:1px solid rgba(255,253,247,.12);backdrop-filter:blur(10px)}.top h1{margin:18px 0 8px;font-size:2.18rem;line-height:1;letter-spacing:-.045em}.clock{font-size:1.02rem;font-weight:800;color:#f2efe7}.hero-grid{display:grid;grid-template-columns:1fr 118px;gap:14px;align-items:center;margin-top:20px}.hero-stat{display:grid;gap:6px}.hero-stat b{font-size:2.85rem;line-height:1;color:#fffefa}.hero-stat span{color:#d9e1dc;font-weight:700}.ring{--pct:0%;width:112px;height:112px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(#d9c099 var(--pct),rgba(255,253,247,.18) 0);box-shadow:inset 0 0 0 1px rgba(255,253,247,.14)}.ring:before{content:"";position:absolute;width:78px;height:78px;border-radius:50%;background:#2f415d}.ring strong{position:relative;font-size:1.15rem;color:#fffefa}.panel{margin:14px 0;padding:18px;border-radius:26px;background:rgba(255,254,250,.92);border:1px solid rgba(228,222,210,.86);box-shadow:0 10px 26px rgba(38,54,79,.07);backdrop-filter:blur(12px)}.panel h2{margin:0 0 14px;font-size:1.16rem;letter-spacing:-.01em}.cta-card{margin-top:-4px}.status{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border-radius:18px;background:#f5f2eb;color:#545f5a;font-weight:720}.dot{width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(47,111,103,.12)}.dot.warn{background:var(--amber);box-shadow:0 0 0 5px rgba(183,121,31,.13)}.punch{width:100%;margin:16px 0 12px;padding:1.16rem 1.2rem;border-radius:22px;background:linear-gradient(135deg,#2f6f67,#26364f);color:#fffefa;font-size:1.22rem;border:0;box-shadow:0 16px 30px rgba(47,111,103,.22)}.next{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:.94rem}.next b{color:var(--ink)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{padding:14px;border-radius:20px;background:#f7f3eb;border:1px solid #ebe5d8}.mini:nth-child(1){background:var(--soft-blue)}.mini:nth-child(2){background:var(--soft-green)}.mini:nth-child(3){background:var(--soft-amber)}.mini b{display:block;font-size:1.35rem;color:var(--navy)}.mini span{font-size:.82rem;color:var(--muted);font-weight:760}.msg{display:none;justify-content:space-between;gap:10px;align-items:center;margin:12px 0;padding:13px 14px;border-radius:18px;background:#f7eadc;color:#8a4b18;border:1px solid #ead2b6;font-weight:740}.msg.show{display:flex}.msg button{padding:4px 10px;background:transparent;color:inherit;border:0}.tab{animation:fade .18s ease}.hidden{display:none!important}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}.toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.summary{display:grid;gap:4px;margin:14px 0;padding:14px;border-radius:20px;background:linear-gradient(135deg,#eef1ed,#f9f6ef);border:1px solid #e4ded2}.summary b{font-size:1.08rem}.summary span{color:var(--muted);font-weight:730}.cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.day{min-height:124px;padding:12px;border-radius:20px;background:#fffefa;border:1px solid #ebe5d8;box-shadow:0 4px 12px rgba(38,54,79,.035)}.day.holiday{background:#fbf0ea;border-color:#ead0c5}.day.has{box-shadow:inset 0 0 0 2px rgba(47,111,103,.38),0 4px 12px rgba(47,111,103,.08)}.daytop{display:flex;justify-content:space-between;align-items:center}.daytop b{font-size:1.15rem}.daytop span{background:#a75656;color:#fffefa;border-radius:999px;padding:2px 8px;font-size:.75rem;font-weight:800}.day p{margin:8px 0;color:#5d665f;font-size:.86rem;line-height:1.35}.day small{color:var(--teal);font-weight:760}.record,.audit{display:grid;gap:8px;padding:13px;border-radius:20px;background:#fffefa;border:1px solid #ebe5d8;margin:10px 0}.record b,.audit b{font-size:1rem}.record small,.audit small,.hint{color:var(--muted);font-weight:650;line-height:1.45}.row{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;width:max-content;border-radius:999px;padding:5px 10px;background:#efece5;color:#535d69;font-size:.82rem;font-weight:800}.ok{background:#dfece2;color:#275c4f}.danger{background:#f3dfdc!important;color:#954646!important}.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;width:min(500px,calc(100% - 22px));display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border-radius:26px;background:rgba(255,254,250,.9);border:1px solid rgba(228,222,210,.92);box-shadow:0 18px 45px rgba(38,54,79,.15);backdrop-filter:blur(18px);padding-bottom:calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{display:grid;gap:2px;place-items:center;padding:8px 4px;border-radius:18px;background:transparent;border:0;color:#7a8179;font-size:.74rem}.bottom-nav button i{font-style:normal;font-size:1.18rem}.bottom-nav button.active{background:#e9eee9;color:#2f6f67}.empty{padding:24px;text-align:center;color:var(--muted);font-weight:700}.file{padding:12px;border:1px dashed #cfc6b7;border-radius:18px;background:#fffefa}@media(max-width:360px){.hero-grid{grid-template-columns:1fr}.ring{display:none}.cal{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.top h1{font-size:1.9rem}}
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="kicker"><span class="pill">今日打卡</span><span id="todayKey"></span></div>
      <h1>打卡记录</h1>
      <div class="clock" id="clock"></div>
      <div class="hero-grid">
        <div class="hero-stat"><b id="effHero">0</b><span id="heroText">本月有效次数</span></div>
        <div class="ring" id="ring"><strong id="ringText">0%</strong></div>
      </div>
    </section>
    <div id="msg" class="msg"><span></span><button onclick="hideMsg()">×</button></div>

    <section id="home" class="tab">
      <article class="panel cta-card"><h2>现在打卡</h2><div class="status"><span id="statusDot" class="dot"></span><span id="eligibility"></span></div><button class="punch" onclick="punchNow()">我已打卡</button><div class="next"><span>下次可打卡</span><b id="nextTime"></b></div></article>
      <article class="panel"><h2 id="monthTitle"></h2><div class="quick"><div class="mini"><b id="reqMini">0</b><span>应打卡</span></div><div class="mini"><b id="remMini">0</b><span>剩余</span></div><div class="mini"><b id="holMini">0</b><span>节假日</span></div></div></article>
    </section>

    <section id="calendar" class="tab hidden"><article class="panel"><div class="toolbar"><button onclick="moveMonth(-1)">‹</button><input id="viewMonth" type="month"/><button onclick="moveMonth(1)">›</button></div><div class="summary" id="monthSummary"></div><div class="cal" id="calendarGrid"></div></article></section>

    <section id="records" class="tab hidden"><article class="panel"><h2>补录</h2><label>打卡时间<input id="manualTime" type="datetime-local"></label><label>备注<input id="manualNote" placeholder="例如：手机没电后补录"></label><button onclick="manualAdd()">保存补录</button></article><article class="panel"><h2>历史记录</h2><div id="recordList"></div></article></section>

    <section id="holidays" class="tab hidden"><article class="panel"><h2>节假日</h2><label>日期<input id="holidayDate" type="date"></label><label>类型<select id="holidayValue"><option value="true">节假日</option><option value="false">工作日/非节假日</option></select></label><label>备注<input id="holidayNote" placeholder="例如：单位另行放假"></label><button onclick="saveHoliday()">保存设置</button><p class="hint" id="builtInLabel"></p></article><article class="panel"><h2>自定义设置</h2><div id="holidayList"></div></article></section>

    <section id="backup" class="tab hidden"><article class="panel"><h2>备份</h2><button onclick="exportData()">导出 JSON</button><label class="file">导入 JSON<input id="importFile" type="file" accept="application/json"></label><p class="hint">换手机、换浏览器或清理数据前，请先导出备份。</p></article><article class="panel"><h2>操作记录</h2><div id="auditList"></div></article></section>
  </main>
  <nav class="bottom-nav">
    <button data-tab="home" class="active"><i>●</i>首页</button><button data-tab="calendar"><i>◔</i>日历</button><button data-tab="records"><i>✎</i>记录</button><button data-tab="holidays"><i>✦</i>节假日</button><button data-tab="backup"><i>⇅</i>备份</button>
  </nav>
<script>
const KEY='attendance-recorder-mobile-file:v1', TZ='Asia/Shanghai', FOUR=4*60*60*1000, MIN=60*1000;
const slots=[['morning','第一时段 07:00-12:00',7,12],['afternoon','第二时段 12:00-18:00',12,18],['evening','第三时段 18:00之后',18,24]];
const source2025='2025年国务院办公厅节假日安排', source2026='2026年国务院办公厅节假日安排';
const holidays=[['2025-01-01','元旦',source2025],...rng('2025-01-28','2025-02-04','春节',source2025),...rng('2025-04-04','2025-04-06','清明节',source2025),...rng('2025-05-01','2025-05-05','劳动节',source2025),...rng('2025-05-31','2025-06-02','端午节',source2025),...rng('2025-10-01','2025-10-08','国庆节/中秋节',source2025),...rng('2026-01-01','2026-01-03','元旦',source2026),...rng('2026-02-15','2026-02-23','春节',source2026),...rng('2026-04-04','2026-04-06','清明节',source2026),...rng('2026-05-01','2026-05-05','劳动节',source2026),...rng('2026-06-19','2026-06-21','端午节',source2026),...rng('2026-09-25','2026-09-27','中秋节',source2026),...rng('2026-10-01','2026-10-07','国庆节',source2026)];
let data=load(), active='home', viewMonth=monthKey(new Date());
document.getElementById('viewMonth').value=viewMonth; document.getElementById('manualTime').value=dtLocal(new Date()); document.getElementById('holidayDate').value=dateKey(new Date());
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab)); document.getElementById('viewMonth').onchange=e=>{viewMonth=e.target.value; render()}; document.getElementById('holidayDate').onchange=render; document.getElementById('importFile').onchange=importData;
setInterval(()=>{renderHome()},1000); render();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||empty()}catch{return empty()}} function save(){localStorage.setItem(KEY,JSON.stringify(data))} function empty(){return{version:1,punches:[],holidayOverrides:[],auditLogs:[]}} function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function parts(x){let d=x instanceof Date?x:new Date(x), arr=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);let m=Object.fromEntries(arr.map(p=>[p.type,p.value]));return{y:+m.year,m:+m.month,d:+m.day,h:+m.hour,mi:+m.minute,s:+m.second}} function pad(n){return String(n).padStart(2,'0')} function dateKey(x){let p=parts(x);return `${p.y}-${pad(p.m)}-${pad(p.d)}`} function monthKey(x){let p=parts(x);return `${p.y}-${pad(p.m)}`} function fmt(x){let p=parts(x);return `${p.y}-${pad(p.m)}-${pad(p.d)} ${pad(p.h)}:${pad(p.mi)}`} function timeOnly(x){let p=parts(x);return `北京时间 ${pad(p.h)}:${pad(p.mi)}:${pad(p.s)}`} function dtLocal(x){let p=parts(x);return `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}`} function parseLocal(v){return new Date(v+':00+08:00')} function at(day,h,m=0,s=0,ms=0){return new Date(`${day}T${pad(h)}:${pad(m)}:${pad(s)}.${String(ms).padStart(3,'0')}+08:00`)}
function rng(a,b,n,s){let out=[],c=Date.parse(a+'T00:00:00+08:00'),e=Date.parse(b+'T00:00:00+08:00');while(c<=e){out.push([new Date(c+8*3600000).toISOString().slice(0,10),n,s]);c+=86400000}return out} function built(day){return holidays.find(h=>h[0]===day)} function isHol(day){let o=data.holidayOverrides.find(x=>x.date===day);return o?o.isHoliday:!!built(day)} function holLabel(day){let o=data.holidayOverrides.find(x=>x.date===day);if(o)return (o.isHoliday?'自定义节假日：':'自定义工作日：')+(o.note||'无备注');let b=built(day);return b?b[1]+'（内置）':''}
function slot(x){let h=parts(x).h;let s=slots.find(v=>h>=v[2]&&h<v[3]);return s?{id:s[0],label:s[1],start:s[2],end:s[3]}:null} function daysIn(m){let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).getUTCDate()} function dates(m){return Array.from({length:daysIn(m)},(_,i)=>m+'-'+pad(i+1))} function addM(m,d){let [y,mo]=m.split('-').map(Number),x=new Date(Date.UTC(y,mo-1+d,1));return x.getUTCFullYear()+'-'+pad(x.getUTCMonth()+1)}
function evals(punches=data.punches){let sorted=[...punches].sort((a,b)=>Date.parse(a.occurredAt)-Date.parse(b.occurredAt)), acc=[], used=new Set();return sorted.map(r=>{let sl=slot(r.occurredAt), day=dateKey(r.occurredAt); if(!sl)return{record:r,slot:'morning',slotLabel:'非有效时段',dateKey:day,valid:false,reason:'00:00-07:00 不属于有效打卡时段'}; let k=day+':'+sl.id;if(used.has(k))return{record:r,slot:sl.id,slotLabel:sl.label,dateKey:day,valid:false,reason:'同一日期同一时段已有 1 次有效打卡'}; let last=acc.at(-1); if(last&&Date.parse(r.occurredAt)-Date.parse(last.record.occurredAt)<=FOUR)return{record:r,slot:sl.id,slotLabel:sl.label,dateKey:day,valid:false,reason:'距离上一条有效打卡未严格超过 4 小时'}; let res={record:r,slot:sl.id,slotLabel:sl.label,dateKey:day,valid:true,reason:'有效打卡'}; acc.push(res); used.add(k); return res})} function valids(){return evals().filter(x=>x.valid)} function stats(m){let ds=dates(m), hc=ds.filter(isHol).length, eff=valids().filter(x=>x.dateKey.startsWith(m)).length, req=Math.ceil(40*(ds.length-hc)/ds.length);return{days:ds.length,hc,eff,req,rem:Math.max(0,req-eff)}} function daily(day){let ev=evals().filter(x=>x.dateKey===day), raw=data.punches.filter(x=>dateKey(x.occurredAt)===day);return{raw:raw.length,valid:ev.filter(x=>x.valid).length,slots:ev.filter(x=>x.valid).map(x=>x.slotLabel),ev}}
function canNow(now=new Date()){let r={id:'candidate',occurredAt:now.toISOString(),createdAt:now.toISOString(),source:'button',note:''};return evals([...data.punches,r]).at(-1)} function nextTime(now=new Date()){let v=valids(), used=new Set(v.map(x=>x.dateKey+':'+x.slot)), last=v.at(-1), min=last?new Date(Date.parse(last.record.occurredAt)+FOUR+MIN):null, today=dateKey(now), mk=monthKey(now); for(let mo of [mk,addM(mk,1)])for(let day of dates(mo)){if(day<today)continue; for(let s of slots){if(used.has(day+':'+s[0]))continue;let st=at(day,s[2]), en=s[3]===24?at(day,23,59,59,999):at(day,s[3]), cand=new Date(Math.max(now.getTime(),st.getTime(),min?min.getTime():0)); if(cand<=en)return cand}} return at(addM(mk,2)+'-01',7)}
function audit(action,note,before,after){data.auditLogs.unshift({id:id('audit'),action,createdAt:new Date().toISOString(),before,after,note})} function msg(t){let m=document.getElementById('msg');m.querySelector('span').textContent=t;m.classList.add('show')} function hideMsg(){document.getElementById('msg').classList.remove('show')} function switchTab(t){active=t;document.querySelectorAll('.tab').forEach(e=>e.classList.add('hidden'));document.getElementById(t).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function punchNow(){let now=new Date(), r={id:id('punch'),occurredAt:now.toISOString(),createdAt:now.toISOString(),source:'button',note:'按钮打卡'}, c=canNow(now);data.punches.push(r);audit('add-punch','按钮打卡',null,r);save();msg(c.valid?`已记录：${fmt(r.occurredAt)}，本次计为有效打卡。`:`已记录原始打卡，但不新增有效次数：${c.reason}`);render()}
function manualAdd(){let note=document.getElementById('manualNote').value.trim();if(!note)return msg('补录必须填写备注。');let r={id:id('punch'),occurredAt:parseLocal(document.getElementById('manualTime').value).toISOString(),createdAt:new Date().toISOString(),source:'manual',note};data.punches.push(r);audit('add-punch',note,null,r);document.getElementById('manualNote').value='';save();msg('已补录打卡记录。');render()}
function editRec(rid){let r=data.punches.find(x=>x.id===rid), t=prompt('修改时间（格式：YYYY-MM-DDTHH:mm）',dtLocal(r.occurredAt));if(!t)return;let n=prompt('修改备注（必填）',r.note);if(!n||!n.trim())return msg('修改取消：必须填写备注。');let before={...r};r.occurredAt=parseLocal(t).toISOString();r.note=n.trim();r.source='manual';audit('update-punch',n.trim(),before,r);save();render()} function delRec(rid){let r=data.punches.find(x=>x.id===rid), n=prompt('删除记录原因/备注（必填）');if(!n||!n.trim())return msg('删除已取消：必须填写备注。');data.punches=data.punches.filter(x=>x.id!==rid);audit('delete-punch',n.trim(),r,null);save();render()}
function saveHoliday(){let day=document.getElementById('holidayDate').value,n=document.getElementById('holidayNote').value.trim();if(!n)return msg('修改节假日必须填写备注。');let before=data.holidayOverrides.find(x=>x.date===day), after={date:day,isHoliday:document.getElementById('holidayValue').value==='true',note:n,updatedAt:new Date().toISOString()};data.holidayOverrides=data.holidayOverrides.filter(x=>x.date!==day).concat(after).sort((a,b)=>a.date.localeCompare(b.date));audit('upsert-holiday',n,before,after);save();msg('已保存节假日覆盖设置。');render()} function delHoliday(day){let o=data.holidayOverrides.find(x=>x.date===day), n=prompt('删除节假日覆盖原因/备注（必填）');if(!n||!n.trim())return;data.holidayOverrides=data.holidayOverrides.filter(x=>x.date!==day);audit('delete-holiday',n.trim(),o,null);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attendance-recorder-'+dateKey(new Date())+'.json';a.click();URL.revokeObjectURL(url)} async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()); if(!Array.isArray(d.punches)||!Array.isArray(d.holidayOverrides)||!Array.isArray(d.auditLogs))throw Error('导入文件格式不正确');let old=data;data={version:1,punches:d.punches,holidayOverrides:d.holidayOverrides,auditLogs:d.auditLogs};audit('import-data','导入备份：'+f.name,old,d);save();msg('导入成功。');render()}catch(err){msg(err.message||'导入失败')}}
function render(){renderHome();renderCalendar();renderRecords();renderHolidays();renderBackup()} function renderHome(){let now=new Date(), s=stats(monthKey(now)), c=canNow(), nt=nextTime(), pct=s.req?Math.min(100,Math.round(s.eff/s.req*100)):0;document.getElementById('todayKey').textContent=dateKey(now);document.getElementById('clock').textContent=timeOnly(now);document.getElementById('effHero').textContent=s.eff;document.getElementById('heroText').textContent=`本月有效 / 目标 ${s.req}`;document.getElementById('ring').style.setProperty('--pct',pct+'%');document.getElementById('ringText').textContent=pct+'%';document.getElementById('eligibility').textContent=c.valid?'现在点击会新增有效次数':c.reason;document.getElementById('statusDot').className='dot '+(c.valid?'':'warn');document.getElementById('nextTime').textContent=fmt(nt);document.getElementById('monthTitle').textContent=monthKey(now)+' 进度';document.getElementById('reqMini').textContent=s.req;document.getElementById('remMini').textContent=s.rem;document.getElementById('holMini').textContent=s.hc}
function renderCalendar(){document.getElementById('viewMonth').value=viewMonth;let s=stats(viewMonth);document.getElementById('monthSummary').innerHTML=`<b>本月应打卡 ${s.req} 次</b><span>有效 ${s.eff} 次 · 节假日 ${s.hc} 天 · 剩余 ${s.rem} 次</span>`;document.getElementById('calendarGrid').innerHTML=dates(viewMonth).map(day=>{let d=daily(day), h=isHol(day);return `<div class="day ${h?'holiday':''} ${d.valid?'has':''}"><div class="daytop"><b>${day.slice(8)}</b>${h?'<span>休</span>':''}</div><p>${holLabel(day)||'普通日'}</p><p>原始 ${d.raw} · 有效 ${d.valid}</p><small>${d.slots.join('、')||'无有效打卡'}</small></div>`}).join('')} function moveMonth(d){viewMonth=addM(viewMonth,d);render()}
function renderRecords(){let sorted=[...data.punches].sort((a,b)=>Date.parse(b.occurredAt)-Date.parse(a.occurredAt));document.getElementById('recordList').innerHTML=sorted.map(r=>{let res=evals().find(x=>x.record.id===r.id);return `<div class="record"><b>${fmt(r.occurredAt)}</b><small>${r.source==='button'?'按钮':'手动'} · ${r.note}</small><span class="badge ${res&&res.valid?'ok':''}">${res&&res.valid?'有效':(res?res.reason:'未计入')}</span><div class="row"><button onclick="editRec('${r.id}')">修改</button><button class="danger" onclick="delRec('${r.id}')">删除</button></div></div>`}).join('')||'<div class="empty">暂无记录</div>'}
function renderHolidays(){let day=document.getElementById('holidayDate').value,b=built(day);document.getElementById('builtInLabel').textContent='当前内置：'+(b?b[1]:'无');document.getElementById('holidayList').innerHTML=data.holidayOverrides.map(o=>`<div class="record"><b>${o.date}</b><small>${o.isHoliday?'节假日':'工作日'} · ${o.note}</small><button class="danger" onclick="delHoliday('${o.date}')">删除</button></div>`).join('')||'<div class="empty">暂无自定义设置</div>'}
function renderBackup(){document.getElementById('auditList').innerHTML=data.auditLogs.slice(0,80).map(a=>`<div class="audit"><b>${fmt(a.createdAt)}</b><small>${a.action} · ${a.note}</small></div>`).join('')||'<div class="empty">暂无操作记录</div>'}
</script>
</body>
</html>
